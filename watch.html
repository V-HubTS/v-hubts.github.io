<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VHT Watch</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Comfortaa', sans-serif;
            background: linear-gradient(135deg, #32cd32, #ffdb58);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 600px;
            height: 600px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            gap: 20px;
        }
        .video-frame {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            border-radius: 8px;
            object-fit: contain;
            width: 384px;
            height: 384px;
        }
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 8px;
            transition: 0.3s;
            width: 160px;
            height: 60px;
        }
        .controls:hover {
            background: rgba(0, 0, 0, 0.5);
        }
        .controls p {
            color: white;
            font-size: 1em;
            text-align: center;
        }
        .input-bar {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .input-bar input {
            width: 100px;
            padding: 5px;
            font-size: 1em;
            text-align: center;
            border-radius: 5px;
            border: 1px solid #000;
        }
        .input-bar button {
            padding: 5px 10px;
            cursor: pointer;
            font-size: 1em;
            background: rgba(0, 0, 0, 0.3);
            border: none;
            border-radius: 5px;
            color: white;
            transition: 0.3s;
        }
        .input-bar button:hover {
            background: rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="video-frame">
            <video id="videoPlayer" controls>
                <source id="videoSource" src="https://v-hubts.github.io/video/01.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        <div class="controls" onclick="nextVideo()">
            <p>Press for next video</p>
        </div>
        <div class="input-bar">
            <input type="number" id="videoId" placeholder="Enter ID">
            <button onclick="loadVideo()">Load Video</button>
        </div>
    </div>

    <script>
        function nextVideo() {
            let videoElement = document.getElementById("videoSource");
            let currentSrc = videoElement.src;
            let match = currentSrc.match(/(\d+)\.mp4$/);

            if (match) {
                let currentNumber = parseInt(match[1], 10);
                let nextNumber = currentNumber + 1;
                let nextFilename = String(nextNumber).padStart(2, '0') + ".mp4";
                let newSrc = currentSrc.replace(/\d+\.mp4$/, nextFilename);

                videoElement.src = newSrc;
                document.getElementById("videoPlayer").load();
            }
        }

        function loadVideo() {
            let videoElement = document.getElementById("videoSource");
            let videoId = document.getElementById("videoId").value.trim();
            if (videoId) {
                let formattedId = String(videoId).padStart(2, '0') + ".mp4";
                videoElement.src = "https://v-hubts.github.io/video/" + formattedId;
                document.getElementById("videoPlayer").load();
            }
        }
    </script>

</body>
</html>
