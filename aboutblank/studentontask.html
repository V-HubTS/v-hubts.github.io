<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About:blank Embedder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            background-color: #000000;
        }
        h1 {
            margin-bottom: 20px;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Redirecting... (Please enable popups at top right corner of browser)</h1>
    <script>
        // Automatically open a new tab with the specified URL in an iframe
        const url = "https://v-hubts.github.io/aboutblank";
        const newWindow = window.open('about:blank', '_blank');
        newWindow.document.write(`<iframe src="${url}" style="border:none; width:100%; height:100vh;"></iframe>`);
    </script>
</body>
</html>
