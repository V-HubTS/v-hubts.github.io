<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About:blank Embedder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column; /* Align items vertically */
            height: 100vh;
            margin: 0;
            background-color: #000000000;
        }
        h1 {
            margin-bottom: 20px;
            color: #333;
        }
        .container {
            display: flex;
            align-items: center;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input[type="text"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-right: 10px;
            flex: 1;
            color: black; /* Changed the color to black */
        }
        input[type="text"]::placeholder {
            color: #ccc;
        }
        button {
            padding: 10px 20px;
            background-color: green; /* Changed the button color to green */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: #fff;
        }
        button:hover {
            background-color: darkgreen; /* Changed the hover color to dark green */
        }
    </style>
</head>
<body>
    <h1>About:blank Embedder</h1>
    <div class="container">
        <input type="text" id="urlInput" placeholder="Must include https://">
        <button onclick="openInAboutBlank()">Go</button>
    </div>
    <script>
        function openInAboutBlank() {
            const url = document.getElementById('urlInput').value;
            if (!url.startsWith('https://')) {
                alert('URL must include https://');
                return;
            }
            const newWindow = window.open('about:blank', '_blank');
            newWindow.document.write('<iframe src="' + url + '" style="border:none; width:100%; height:100vh;"></iframe>');
        }
    </script>
</body>
</html>
