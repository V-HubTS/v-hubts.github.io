<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Local Time and Play Games</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Comic Sans MS', sans-serif;
            text-align: center;
            background: linear-gradient(to bottom, white, red);
            background-size: 150% 150%;
            animation: gradientFlow 10s ease infinite;
        }
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        #content {
            margin-top: 50px;
            position: relative;
        }
        #time {
            font-size: 3em;
            margin-bottom: 20px;
        }
        #playButton,
        #visitButton {
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            margin-top: 10px;
        }
        .battery {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }
        .battery-icon {
            width: 30px;
            height: 60px;
            border: 3px solid black;
            border-radius: 5px;
            position: relative;
            margin-right: 10px;
        }
        .battery-icon::before {
            content: '';
            width: 10px;
            height: 10px;
            background-color: black;
            position: absolute;
            top: -10px;
            left: 10px;
            border-radius: 2px;
        }
        .battery-level {
            height: 100%;
            width: 0;
            background-color: green;
        }
        .ripple {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            animation: rippleAnimation 3s infinite;
            transform: translate(-50%, -50%);
        }
        @keyframes rippleAnimation {
            0% { width: 20px; height: 20px; opacity: 1; }
            100% { width: 300px; height: 300px; opacity: 0; }
        }
        #searchBar {
            margin-top: 20px;
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 25px; /* Added to make it rounded */
            width: 80%;
            font-size: 1em;
            transition: border-color 0.3s; /* Smooth transition for border color */
        }
        #searchBar:focus {
            border-color: #333; /* Darker border on focus */
            outline: none; /* Remove default outline */
        }
    </style>
</head>
<body>
    <div class="ripple"></div>
    <div id="content">
        <div id="time"></div>
        <button id="playButton" onclick="playGames()">Play some games</button>
        <button id="visitButton" onclick="visitVHub()">Visit V-Hub.TS</button>
        <div class="battery">
            <div class="battery-icon">
                <div class="battery-level" id="battery-level"></div>
            </div>
            <div id="battery-percentage"></div>
        </div>
        <input type="text" id="searchBar" placeholder="Enter a link or search query" onkeypress="handleKeyPress(event)">
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; // the hour '0' should be '12'
            const currentTime = `${hours}:${minutes}:${seconds} ${ampm}`;

            document.getElementById('time').innerText = currentTime;
        }

        function playGames() {
            window.location.href = "https://v-hubts.github.io/3kh0.html";
        }

        function visitVHub() {
            window.location.href = "https://v-hubts.github.io";
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                const query = event.target.value;
                if (query.startsWith('https://')) {
                    window.location.href = query;
                } else {
                    window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
                }
            }
        }

        function updateBatteryStatus(battery) {
            const level = battery.level * 100;
            const batteryLevelDiv = document.getElementById('battery-level');
            const batteryPercentageDiv = document.getElementById('battery-percentage');
            batteryLevelDiv.style.width = level + '%';
            batteryPercentageDiv.innerText = Math.round(level) + '%';

            if (level > 50) {
                batteryLevelDiv.style.backgroundColor = 'green';
            } else if (level > 20) {
                batteryLevelDiv.style.backgroundColor = 'yellow';
            } else {
                batteryLevelDiv.style.backgroundColor = 'red';
            }
        }

        navigator.getBattery().then((battery) => {
            updateBatteryStatus(battery);
            battery.addEventListener('levelchange', () => {
                updateBatteryStatus(battery);
            });
        });

        // Update the time every second
        setInterval(updateTime, 1000);

        // Initial time update
        updateTime();
    </script>
</body>
</html>
